# ================================================================
# 测试环境配置 (application-test.yml)
# ================================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:test-db-host}:3306/reimbursement_db?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:reimbursement_user}
    password: ${DB_PASSWORD:changeme}

  data:
    redis:
      host: ${REDIS_HOST:test-redis-host}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1

logging:
  level:
    com.project.reimbursement: INFO
    org.springframework.security: INFO
