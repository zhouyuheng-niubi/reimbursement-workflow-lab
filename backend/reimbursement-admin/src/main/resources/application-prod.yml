# ================================================================
# 生产环境配置 (application-prod.yml)
# ALL sensitive values MUST be supplied via environment variables
# ================================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:reimbursement_db}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&requireSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      stat-view-servlet:
        enabled: false   # Disable Druid web console in production

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      ssl:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${REDACTED_CREDENTIAL_NAME}

storage:
  type: minio
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET:reimbursement}
  # 文件下载 URL 前缀 — 生产必须显式配置成对外可访问的域名
  # 例如: https://reimb.project.com/api/v1/files
  # 不配置会导致前端拿到的文件 URL 指向 localhost:8080
  local:
    url-prefix: ${FILE_URL_PREFIX}

logging:
  level:
    com.project.reimbursement: WARN
    org.springframework: WARN

knife4j:
  enable: false

springdoc:
  api-docs:
    enabled: false

cors:
  allowed-origins: https://reimb.project.com
