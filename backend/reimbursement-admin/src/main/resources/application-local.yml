# ================================================================
# 本地测试配置 (application-local.yml)
# 端口: 18760, MySQL密码: 123456, Redis无密码
# ================================================================

server:
  port: 18760

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/reimbursement_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    druid:
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: admin123
        allow: 127.0.0.1

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

# SQL日志（INFO级别，不输出全部DEBUG）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.project.reimbursement: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
  file:
    path: /tmp/reimbursement/logs

# 本地文件存储
storage:
  type: local
  local:
    base-path: /tmp/reimbursement/files
    url-prefix: http://localhost:18760/api/v1/files
